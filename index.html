<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agency Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#0f1b2d;--mute:#5d6b7e;--line:#d9dfe7;--acc:#3b4cca;--accbg:#e6e9fb;--pos:#16794c;--neg:#b42318;--warn:#9a5b00;--onacc:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--card:#16202f;--ink:#e8edf5;--mute:#93a1b5;--line:#26334a;--acc:#8d9bff;--accbg:#232c52;--pos:#4fd19a;--neg:#ff8c7d;--warn:#e8b04b;--onacc:#0d1420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1420;--card:#16202f;--ink:#e8edf5;--mute:#93a1b5;--line:#26334a;--acc:#8d9bff;--accbg:#232c52;--pos:#4fd19a;--neg:#ff8c7d;--warn:#e8b04b;--onacc:#0d1420;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 14px 96px;max-width:560px;margin:0 auto}
h1,h2,.big,.num{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif}
h1{font-size:20px;margin:18px 0 2px}
h2{font-size:16px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:13px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.hero{padding:18px 16px}
.big{font-size:42px;line-height:1.05;font-weight:700;margin:4px 0 6px;letter-spacing:-.02em}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.st span{display:block;color:var(--mute);font-size:12.5px}
.st b{display:block;font-size:19px;margin-top:2px;font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:600}
.bar{position:relative;height:10px;border-radius:6px;background:var(--line);margin:12px 0 6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--acc)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--accbg);color:var(--acc)}
.chip.ok{background:transparent;border:1px solid var(--pos);color:var(--pos)}.chip.no{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mute{color:var(--mute);font-size:13px}
label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:42px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:500;border:0;border-radius:9px;padding:10px 14px;min-height:42px;background:var(--acc);color:var(--onacc);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:transparent;color:var(--mute);min-height:36px;padding:4px 10px}
.full{width:100%;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:transparent;color:var(--mute);border-radius:0;min-height:54px;font-size:14px}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.empty{text-align:center;color:var(--mute);padding:26px 10px;border:1px dashed var(--line);border-radius:12px;margin:10px 0}
.sm{min-height:38px;padding:0 10px;font-size:14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.fu{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.card details{margin:10px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.fc{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap;min-height:36px;padding:0 12px;font-size:14px;flex:0 0 auto}
.fc.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cards .card{margin:0}
.gh{margin:22px 0 8px;font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 8px}
.seg button{border-radius:0;background:var(--card);color:var(--mute);min-height:44px}
.seg button.on{background:var(--acc);color:var(--onacc)}
textarea{resize:vertical}
@media (min-width:900px){body{max-width:none;padding:0 32px 96px}nav div{max-width:none}.grid{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}.seg{max-width:420px}}
pre{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12px;overflow-x:auto;margin:6px 0}
.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:500;min-height:42px;border-radius:9px;border:1px solid var(--line);color:var(--ink)}
details{margin:14px 0}summary{cursor:pointer;font-weight:500;padding:8px 0}
.wk{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
var KEY='agency-tracker-v2',STAGES=['Lead','Requirement discussion','Demo','Demo delivered','Advance paid','Delivered','Lost'],PAY=['Advance paid','Delivered'];
var uid=function(){return Math.random().toString(36).slice(2,9)};
var todayISO=function(){return new Date().toLocaleDateString('en-CA')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var inr=function(n){n=Number(n)||0;return(n<0?'-':'')+'\u20b9'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2})};
var pc=function(n){return(n*100).toFixed(1)+'%'};
var fd=function(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'-'};
function seed(){return{price:2999,target:15,log:[],clients:[]}}
var S,tab='home';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.log||!S.clients)S=seed();
var NAT=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()),LN=NAT&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications,REM='agency-tracker-rem';
function remOn(){try{return localStorage.getItem(REM)==='1'}catch(e){return false}}
async function schedule(){if(!LN||!remOn())return;
try{var pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(function(n){return{id:n.id}})});
var now=new Date(),items=[],i=1;
S.clients.forEach(function(x){var o=OFF[x.stage];if(!o||!x.next)return;var t=x.time||S.fuTime||'11:30',p=t.split(':'),at=new Date(x.next+'T'+t+':00');
if(!(at>now)){at=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+p[0],+p[1]);if(!(at>now))at.setDate(at.getDate()+1)}
items.push({id:i++,title:'Follow up: '+x.name,body:x.stage+', touch '+((x.touches||0)+1)+' of '+o.length+' at '+ft(t),schedule:{at:at,allowWhileIdle:true},channelId:'followups',extra:{cid:x.id}})});
if(items.length)await LN.schedule({notifications:items})}catch(e){}}
async function enableReminders(){if(!LN)return 'Phone reminders work only in the Android app.';
try{var p=await LN.requestPermissions();if(p.display!=='granted')return 'Notifications are blocked. Allow them for this app in Android settings.';
await LN.createChannel({id:'followups',name:'Follow-ups',description:'Lead follow-up reminders',importance:5,visibility:1,vibration:true});
try{var ex=await LN.checkExactNotificationSetting();if(ex.exact_alarm!=='granted')await LN.changeExactNotificationSetting()}catch(e){}
try{localStorage.setItem(REM,'1')}catch(e){}await schedule();return 'Reminders are on.'}catch(e){return 'Could not turn on reminders.'}}
async function testReminder(){if(!LN)return 'Phone reminders work only in the Android app.';
try{await LN.schedule({notifications:[{id:9999,title:'Test reminder',body:'Follow-up reminders are working.',schedule:{at:new Date(Date.now()+10000),allowWhileIdle:true},channelId:'followups'}]});return 'Test sent. Close the app and wait 10 seconds.'}catch(e){return 'Could not send a test. Turn on reminders first.'}}
function initNative(){if(!LN)return;try{LN.addListener('localNotificationActionPerformed',function(){tab='home';render()})}catch(e){}schedule();document.addEventListener('visibilitychange',function(){if(!document.hidden)schedule()})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push();try{schedule()}catch(e){}}
var FB='agency-tracker-fb',fbc=null,ref=null,syncState='off',ready=false,wt=null;
try{fbc=JSON.parse(localStorage.getItem(FB))}catch(e){fbc=null}
var syncLabel=function(){return{off:'Sync off',connecting:'Syncing',synced:'Synced',error:'Sync error'}[syncState]};
function setSync(s){syncState=s;var e=document.getElementById('syncchip');if(e)e.textContent=syncLabel()}
var norm=function(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){return Object.keys(v).sort().reduce(function(a,q){a[q]=v[q];return a},{})}return v})};
function parseCfg(t){var m=String(t).match(/\{[\s\S]*\}/);if(!m)return null;var j=m[0];try{return JSON.parse(j)}catch(e){}
try{j=j.replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*\}/g,'}');return JSON.parse(j)}catch(e){return null}}
function connect(){ready=false;ref=null;if(!fbc||!fbc.config||!fbc.key||!window.firebase){setSync('off');return}
try{var app=firebase.apps.length?firebase.app():firebase.initializeApp(fbc.config);ref=firebase.database(app).ref('agencyTracker/'+fbc.key);setSync('connecting');
ref.on('value',function(snap){var val=snap.val();
if(val){var n={price:+val.price||2999,target:+val.target||15,log:val.log||[],clients:val.clients||[],fuTime:val.fuTime||'',dd:val.dd||0};
if(norm(n)!==norm(S)){try{if(!ready&&(S.log.length||S.clients.length))localStorage.setItem(KEY+'-before-sync',JSON.stringify(S))}catch(e){}S=n;mig();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
ready=true;setSync('synced')}else{ready=true;push()}},function(){setSync('error')})}catch(e){setSync('error')}}
function push(){if(!ref||!ready)return;clearTimeout(wt);wt=setTimeout(function(){setSync('connecting');ref.set(S).then(function(){setSync('synced')}).catch(function(){setSync('error')})},400)}
var OFF={'Lead':[0,2,5],'Requirement discussion':[0,2,5],'Demo':[0,1],'Demo delivered':[1,2,6]};
function plan(x,base){var o=OFF[x.stage];x.base=base;x.touches=0;x.next=o?addDays(base,o[0]):''}
function mig(){var ch=false;if(!S.dd){S.clients.forEach(function(x){if(x.stage==='Demo'){x.stage='Demo delivered';ch=true}});S.dd=1;ch=true}S.clients.forEach(function(x){if(OFF[x.stage]&&x.touches===undefined){var t0=todayISO();plan(x,addDays(t0,-OFF[x.stage][0]));x.next=t0;ch=true}});if(ch)save();return ch}
var fc=function(id){return S.clients.filter(function(k){return k.id===id})[0]};
var MSGS=['Hi {n}, did you get a chance to look at your website preview? It goes offline soon. Should I go ahead with this design, or change the colors?','Hi {n}, last reminder: your preview expires in a few hours. Pay the \u20b9999 advance to keep the price at \u20b92,999. Should I lock it for you?','Hi {n}, your preview was taken down but I still have it saved. Want me to restore it this week? Reply NO if it is not the right time.'];
function MSG(x,i){i=i||0;var n=x.name,l=x.link||'[demo link]';
if(x.stage==='Demo')return i===0?'Hi '+n+', your website preview is ready: '+l+' It stays live for 48 hours. Should I go ahead with this design, or change the colors?':MSGS[0].replace('{n}',n);
if(x.stage==='Demo delivered')return MSGS[Math.min(i,2)].replace('{n}',n);
if(i===0)return 'Hi '+n+', thanks for your enquiry about a website. What does your business do, and when would you like to go live? I will send you a free preview.';
return MSGS[Math.min(i,2)].replace('{n}',n)}
function dueList(){var t=todayISO();return S.clients.filter(function(x){var o=OFF[x.stage];return o&&((x.next&&x.next<=t)||(x.touches>=o.length&&!x.next))}).sort(function(a,b){var ka=(a.next||'')+(a.time||S.fuTime||'11:30'),kb=(b.next||'')+(b.time||S.fuTime||'11:30');return ka<kb?-1:1})}
function dueItem(x){var o=OFF[x.stage],fin=x.touches>=o.length&&!x.next,late=x.next?Math.round((new Date(todayISO())-new Date(x.next))/864e5):0,tel=(x.phone||'').replace(/\D/g,''),wa=tel.length===10?'91'+tel:tel,id=' data-id="'+x.id+'"';
var info=fin?'No reply after all follow-ups':esc(x.stage)+', touch '+((x.touches||0)+1)+' of '+o.length+(late>0?' \u00b7 '+late+(late>1?' days':' day')+' late':'')+' \u00b7 '+ft(x.time||S.fuTime||'11:30');
var acts=fin?'<div class="three" style="grid-template-columns:1fr 1fr"><button class="ghost sm" data-a="frestart"'+id+'>Restart</button><button class="ghost sm" data-a="flost"'+id+'>Mark lost</button></div>':
'<div class="three">'+(tel?'<a class="btn ghost sm" href="tel:+'+wa+'">Call</a><a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+encodeURIComponent(MSG(x,x.touches))+'">WhatsApp</a>':'<span class="mute" style="grid-column:1/3;align-self:center">No phone number yet</span>')+'<button class="pri sm" data-a="fdone"'+id+'>Done</button></div>';
return '<div class="fu"><div class="row"><b>'+esc(x.name)+'</b>'+(fin?'':'<button class="del" data-a="fsnooze"'+id+'>Tomorrow</button>')+'</div><div class="mute">'+info+'</div>'+acts+'</div>'}
function dueSection(){var d=dueList();if(!d.length)return '<div class="card"><div class="row"><b>Follow-ups</b><span class="chip ok">All clear</span></div></div>';
var rest=d.slice(2);
return '<div class="card"><div class="row"><b>Follow up today</b><span class="chip no">'+d.length+'</span></div>'+d.slice(0,2).map(dueItem).join('')+(rest.length?'<details><summary class="mute">Show '+rest.length+' more</summary>'+rest.map(dueItem).join('')+'</details>':'')+'</div>'}
var sum=function(a,k){return a.reduce(function(t,x){return t+(Number(x[k])||0)},0)};
function calc(){var c={};c.spend=sum(S.log,'spend');c.leads=sum(S.log,'leads');c.demos=sum(S.log,'demos');c.revenue=sum(S.clients,'paid');c.costs=sum(S.log,'costs');
c.paying=S.clients.filter(function(x){return PAY.indexOf(x.stage)>-1});
c.n=c.paying.length;c.cpl=c.leads?c.spend/c.leads:0;c.rate=c.leads?c.n/c.leads:0;c.cppc=c.n?c.spend/c.n:0;
c.profit=c.revenue-c.spend-c.costs;c.roas=c.spend?c.revenue/c.spend:0;c.be=S.price?c.cpl/S.price:0;c.goal=1/S.target;
c.owed=c.paying.reduce(function(t,x){return t+Math.max(0,(+x.price||0)-(+x.paid||0))},0);
c.demo=S.clients.filter(function(x){return x.stage==='Demo delivered'}).length;c.req=S.clients.filter(function(x){return x.stage==='Requirement discussion'}).length;
c.care=c.paying.filter(function(x){return x.care}).length;c.uptake=c.n?c.care/c.n:0;return c}
function monday(d){var t=new Date(d+'T00:00:00Z'),k=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-k);return t.toISOString().slice(0,10)}
function addDays(d,n){var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
var st=function(l,v){return '<div class="st"><span>'+l+'</span><b>'+v+'</b></div>'};
function home(){var c=calc(),ok=c.rate>=c.goal,mx=Math.max(c.rate,c.goal)*1.4||1;
return '<h1>Agency tracker</h1><p class="sub">Sales against ad spend <span id="syncchip" class="chip">'+syncLabel()+'</span></p>'+
'<div class="card hero"><span class="mute">Profit after ad spend and costs</span><div class="big '+(c.profit>=0?'pos':'neg')+'">'+inr(c.profit)+'</div><span class="mute">'+inr(c.revenue)+' collected, minus '+inr(c.spend+c.costs)+' of ad spend and costs</span></div>'+dueSection()+
'<div class="card"><div class="row"><b>Close rate '+pc(c.rate)+'</b><span class="chip '+(ok?'ok':'no')+'">'+(ok?'On target':'Below target')+'</span></div>'+
'<div class="bar"><i style="width:'+Math.min(100,c.rate/mx*100)+'%"></i><u style="left:'+Math.min(99,c.goal/mx*100)+'%"></u></div>'+
'<span class="mute">'+c.n+' of '+c.leads+' leads paid. Goal is 1 in '+S.target+' ('+pc(c.goal)+').</span></div>'+
'<div class="grid">'+st('Paying clients',c.n)+st('Cost per paying client',inr(c.cppc))+st('Leads',c.leads)+st('Balance to collect',inr(c.owed))+'</div>'+
'<details><summary>More numbers</summary><div class="grid">'+st('Cost per lead',inr(c.cpl))+st('Return on ad spend',c.roas.toFixed(2)+'x')+st('Break-even close rate',pc(c.be))+st('Care plan uptake',pc(c.uptake))+st('Demos sent',c.demos)+st('Demo delivered',c.demo)+st('In discussion',c.req)+'</div></details>'+
'<details><summary>Settings and backup</summary><div class="card"><div class="two"><div><label>Package price</label><input id="price" type="number" inputmode="decimal" value="'+S.price+'"></div><div><label>Goal: 1 paying client in every</label><input id="tgt" type="number" inputmode="numeric" value="'+S.target+'"></div></div>'+
'<label>Default follow-up time</label><input id="fut" type="time" value="'+esc(S.fuTime||'11:30')+'"><button class="ghost full" data-a="settings">Save settings</button><button class="ghost full" data-a="export">Show backup text</button><textarea id="bk" rows="4" placeholder="Paste backup text here, then tap Restore"></textarea><button class="ghost full" data-a="import">Restore from backup text</button><button class="ghost full" data-a="reset" id="rs">Clear all data</button></div></details>'+
'<details><summary>Phone reminders</summary><div class="card">'+(NAT?'<p class="mute" style="margin-top:0">Get a notification on your phone at each lead\u2019s follow-up time, even when the app is closed. '+(remOn()?'Reminders are on.':'Reminders are off.')+'</p><button class="pri full" data-a="remon">Turn on reminders</button><button class="ghost full" data-a="remtest">Send a test in 10 seconds</button><p id="remmsg" class="mute"></p><p class="mute">If reminders arrive late, set this app to No restrictions in your phone\u2019s battery settings and allow auto-start.</p>':'<p class="mute" style="margin:0">Install the Android app to get follow-up notifications on your phone.</p>')+'</div></details>'+
'<details><summary>Sync across devices</summary><div class="card"><p class="mute" style="margin-top:0">Uses your own free Firebase Realtime Database. Use the same config and sync key on every device. The newest change wins.</p>'+
'<label>Firebase config (paste the firebaseConfig object)</label><textarea id="fbcfg" rows="5" placeholder="{ apiKey: ..., databaseURL: ..., projectId: ... }"></textarea>'+
'<label>Sync key (long and private, acts as your password)</label><input id="fbkey" type="text" autocomplete="off" value="'+esc(fbc&&fbc.key||'')+'"><button class="ghost full" data-a="syncgen">Make a random key</button>'+
'<button class="pri full" data-a="syncon">Connect and sync</button><button class="ghost full" data-a="syncoff">Turn sync off</button><p id="syncmsg" class="mute"></p>'+
'<p class="mute">In Firebase, open Realtime Database, then Rules, and use these so only people who know your key can reach your data:</p><pre>{\n  "rules": {\n    "agencyTracker": {\n      "$key": { ".read": true, ".write": true }\n    }\n  }\n}</pre></div></details>'}
function logTab(){var rows=S.log.slice().sort(function(a,b){return a.date<b.date?1:-1});
return '<h1>Daily log</h1><p class="sub">Add ad spend, leads, demos and costs. Payments go on the Clients tab.</p>'+
'<div class="card"><div class="two"><div><label>Date</label><input id="ld" type="date" value="'+todayISO()+'"></div><div><label>Ad spend (\u20b9)</label><input id="ls" type="number" inputmode="decimal"></div><div><label>Leads</label><input id="ll" type="number" inputmode="numeric"></div><div><label>Demos sent</label><input id="lm" type="number" inputmode="numeric"></div><div><label>Domain and other costs (\u20b9)</label><input id="lc" type="number" inputmode="decimal"></div></div><label>Note</label><input id="ln" type="text"><button class="pri full" data-a="addlog">Add entry</button></div>'+
(rows.length?rows.map(function(r){return '<div class="card"><div class="row"><b>'+fd(r.date)+'</b><button class="del" data-a="dellog" data-id="'+r.id+'" aria-label="Delete entry">Delete</button></div><div class="mute">'+(r.spend?'Ad spend '+inr(r.spend)+'. ':'')+(r.leads?r.leads+' leads. ':'')+(r.demos?r.demos+' demos. ':'')+(r.costs?'Costs '+inr(r.costs)+'. ':'')+esc(r.note)+'</div></div>'}).join(''):'<div class="empty">No entries yet. Add today\u2019s spend and leads above.</div>')}
var cf='all',cq='',cpanel='leads',LEAD_ST=['Demo delivered','Requirement discussion','Demo','Lead','Lost'],PROJ_ST=['Advance paid','Delivered'];
function ft(t){var p=String(t||'11:30').split(':'),h=+p[0]||0,m=p[1]||'00',z=h>=12?'pm':'am';h=h%12||12;return h+':'+m+' '+z}
var lab=function(s){return s==='Requirement discussion'?'Discussion':s};
var fkey=function(x){return(x.next||'9999-12-31')+(x.time||S.fuTime||'11:30')};
var byKey=function(a,b){var ka=fkey(a),kb=fkey(b);return ka<kb?-1:ka>kb?1:String(a.name).localeCompare(String(b.name))};
function clientCard(x){var bal=PAY.indexOf(x.stage)>-1?Math.max(0,x.price-x.paid):0,fu=OFF[x.stage]||PAY.indexOf(x.stage)>-1,d=' data-id="'+x.id+'"';
return '<div class="card"><div class="row"><b>'+esc(x.name)+'</b><button class="del" data-a="delcl"'+d+' aria-label="Delete client">Delete</button></div>'+
'<div class="two"><div><label>Stage</label><select data-c="stage"'+d+'>'+STAGES.map(function(s){return '<option'+(s===x.stage?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div><div><label>Lead date</label><input type="date" data-c="lead"'+d+' value="'+esc(x.lead)+'"></div><div><label>Price (\u20b9)</label><input type="number" inputmode="decimal" data-c="price"'+d+' value="'+x.price+'"></div><div><label>Paid so far (\u20b9)</label><input type="number" inputmode="decimal" data-c="paid"'+d+' value="'+x.paid+'"></div></div>'+
'<label>Phone</label><input type="tel" inputmode="tel" data-c="phone"'+d+' value="'+esc(x.phone)+'">'+
(fu?'<div class="two"><div><label>Next follow-up</label><input type="date" data-c="next"'+d+' value="'+esc(x.next)+'"></div><div><label>Follow-up time</label><input type="time" data-c="time"'+d+' value="'+esc(x.time||S.fuTime||'11:30')+'"></div></div>':'')+
'<label>Notes</label><textarea rows="2" data-c="notes"'+d+' placeholder="Notes about this client">'+esc(x.notes)+'</textarea>'+
'<div class="row" style="margin-top:10px"><label style="margin:0"><input type="checkbox" style="width:auto;min-height:0" data-c="care"'+d+(x.care?' checked':'')+'> On a care plan</label><span class="mute">'+(bal?'Balance '+inr(bal):'')+'</span></div></div>'}
function filterBar(){var c={};S.clients.forEach(function(x){c[x.stage]=(c[x.stage]||0)+1});
var cnt=function(a){return a.reduce(function(t,k){return t+(c[k]||0)},0)},nl=cnt(LEAD_ST),np=cnt(PROJ_ST),pr=cpanel==='projects',sts=pr?PROJ_ST:LEAD_ST;
var seg='<div class="seg"><button class="'+(pr?'':'on')+'" data-a="cpanel" data-v="leads">Leads '+nl+'</button><button class="'+(pr?'on':'')+'" data-a="cpanel" data-v="projects">Projects '+np+'</button></div>';
var o=[['all','All',pr?np:nl]].concat(sts.map(function(k){return[k,lab(k),c[k]||0]}));
return seg+'<div class="chips">'+o.map(function(k){return '<button class="fc'+(cf===k[0]?' on':'')+'" data-a="cfilter" data-v="'+esc(k[0])+'">'+esc(k[1])+' '+k[2]+'</button>'}).join('')+'</div><input id="cq" type="search" placeholder="Search by name, phone or notes" value="'+esc(cq)+'" style="margin-top:8px">'}
function clientList(){var q=cq.trim().toLowerCase(),qd=q.replace(/\D/g,''),pr=cpanel==='projects',sts=pr?PROJ_ST:LEAD_ST;
var L=S.clients.filter(function(x){if(sts.indexOf(x.stage)<0)return false;if(cf!=='all'&&x.stage!==cf)return false;
return !q||x.name.toLowerCase().indexOf(q)>-1||(x.notes||'').toLowerCase().indexOf(q)>-1||(qd&&(x.phone||'').replace(/\D/g,'').indexOf(qd)>-1)});
if(!L.length)return '<div class="empty">'+(pr?'No projects yet. A lead moves here once an advance is paid.':'No leads match this view.')+'</div>';
if(pr)return '<div class="cards">'+L.sort(byKey).map(clientCard).join('')+'</div>';
return sts.map(function(k){var g=L.filter(function(x){return x.stage===k}).sort(byKey);return g.length?'<h2 class="gh">'+esc(lab(k))+' <span class="mute">'+g.length+'</span></h2><div class="cards">'+g.map(clientCard).join('')+'</div>':''}).join('')}
function clientsTab(){
return '<h1>Clients</h1><p class="sub">Leads are in the first tab, paying projects in the second. Each list runs from the earliest follow-up date.</p>'+
'<details><summary>Add a client</summary><div class="card"><label>Client or business</label><input id="cn" type="text"><label>Phone (optional)</label><input id="cph" type="tel" inputmode="tel"><div class="two"><div><label>Stage</label><select id="cs">'+STAGES.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></div><div><label>Lead date</label><input id="cl" type="date" value="'+todayISO()+'"></div><div><label>Price (\u20b9)</label><input id="cp" type="number" inputmode="decimal" value="'+S.price+'"></div><div><label>Paid so far (\u20b9)</label><input id="ca" type="number" inputmode="decimal"></div></div><label>Notes (optional)</label><textarea id="cnt" rows="2"></textarea><button class="pri full" data-a="addcl">Add client</button></div></details>'+
filterBar()+'<div id="cllist">'+clientList()+'</div>'}
function weeks(){var d={};S.log.forEach(function(r){d[monday(r.date)]=1});S.clients.forEach(function(x){if(x.lead)d[monday(x.lead)]=1});
var ws=Object.keys(d).sort(),t=todayISO(),nl=S.clients.filter(function(x){return PAY.indexOf(x.stage)>-1&&!x.lead}).length;
return '<h1>Weekly batches</h1><p class="sub">Close rate by the week leads arrived. Weeks starting Monday.</p>'+
(ws.length?ws.map(function(w){var e=addDays(w,6),L=0,sp=0;S.log.forEach(function(r){if(r.date>=w&&r.date<=e){L+=+r.leads||0;sp+=+r.spend||0}});
var n=S.clients.filter(function(x){return PAY.indexOf(x.stage)>-1&&x.lead&&x.lead>=w&&x.lead<=e}).length,mat=t>=addDays(e,14);
return '<div class="card"><div class="row"><b>'+fd(w)+' to '+fd(e)+'</b><span class="chip '+(mat?'ok':'')+'">'+(mat?'Matured':'Still maturing')+'</span></div><div class="grid" style="margin-top:10px">'+st('Leads',L)+st('Paying clients',n)+st('Close rate',L?pc(n/L):'-')+st('Cost per paying client',n?inr(sp/n):'-')+'</div></div>'}).join(''):'<div class="empty">Add log entries to see weekly results.</div>')+
(nl?'<p class="mute">'+nl+' paying client'+(nl>1?'s have':' has')+' no lead date yet, so they are not counted in any week. Add the dates on the Clients tab.</p>':'')}
function render(){var nd=dueList().length;document.title=(nd?'('+nd+') ':'')+'Agency Tracker';document.getElementById('app').innerHTML=tab==='home'?home():tab==='log'?logTab():tab==='cl'?clientsTab():weeks();
document.getElementById('nav').innerHTML=[['home',nd?'Summary ('+nd+')':'Summary'],['log','Log'],['cl','Clients'],['wk','Weeks']].map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')}
var v=function(i){var e=document.getElementById(i);return e?e.value:''};
document.addEventListener('click',function(e){var t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();window.scrollTo(0,0);return}
var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
if(a==='addlog'){S.log.push({id:uid(),date:v('ld')||todayISO(),spend:+v('ls')||0,leads:+v('ll')||0,demos:+v('lm')||0,revenue:0,costs:+v('lc')||0,note:v('ln')})}
else if(a==='dellog'){S.log=S.log.filter(function(r){return r.id!==id})}
else if(a==='addcl'){if(!v('cn').trim())return;var nc={id:uid(),name:v('cn').trim(),stage:v('cs'),price:+v('cp')||0,paid:+v('ca')||0,care:false,lead:v('cl'),phone:v('cph').trim(),notes:v('cnt').trim()};plan(nc,todayISO());S.clients.push(nc)}
else if(a==='delcl'){S.clients=S.clients.filter(function(x){return x.id!==id})}
else if(a==='settings'){S.price=+v('price')||S.price;S.target=Math.max(1,+v('tgt')||S.target);S.fuTime=v('fut')||S.fuTime||'11:30'}
else if(a==='export'){save();render();document.querySelector('details').open=true;document.getElementById('bk').value=JSON.stringify(S);return}
else if(a==='import'){try{var o=JSON.parse(v('bk'));if(o&&o.log&&o.clients){S=o}}catch(x){return}}
else if(a==='remon'){enableReminders().then(function(m){var e=document.getElementById('remmsg');if(e)e.textContent=m;if(m==='Reminders are on.')setTimeout(render,1200)});return}
else if(a==='remtest'){testReminder().then(function(m){var e=document.getElementById('remmsg');if(e)e.textContent=m});return}
else if(a==='cfilter'){cf=b.dataset.v;render();return}
else if(a==='cpanel'){cpanel=b.dataset.v;cf='all';render();return}
else if(a==='fdone'){var q=fc(id),o=OFF[q.stage];q.touches=(q.touches||0)+1;q.next=q.touches<o.length?addDays(q.base||todayISO(),o[q.touches]):'';if(q.next&&q.next<=todayISO())q.next=addDays(todayISO(),1)}
else if(a==='fsnooze'){fc(id).next=addDays(todayISO(),1)}
else if(a==='flost'){var y=fc(id);y.stage='Lost';y.next=''}
else if(a==='frestart'){plan(fc(id),todayISO())}
else if(a==='syncgen'){var u=new Uint8Array(18);crypto.getRandomValues(u);document.getElementById('fbkey').value=Array.prototype.map.call(u,function(x){return x.toString(36).padStart(2,'0')}).join('').slice(0,26);return}
else if(a==='syncon'){var fcfg=parseCfg(v('fbcfg')),ky=v('fbkey').trim(),m=document.getElementById('syncmsg');
if(!fcfg||!fcfg.apiKey||!fcfg.databaseURL){m.textContent='Paste the full firebaseConfig object, including apiKey and databaseURL.';return}
if(ky.length<16||/[^A-Za-z0-9_-]/.test(ky)){m.textContent='Use a sync key of 16 or more letters and numbers, with no spaces or symbols.';return}
fbc={config:fcfg,key:ky};try{localStorage.setItem(FB,JSON.stringify(fbc))}catch(x){}connect();render();return}
else if(a==='syncoff'){if(ref)ref.off();ref=null;fbc=null;ready=false;try{localStorage.removeItem(FB)}catch(x){}setSync('off');render();return}
else if(a==='reset'){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again to clear everything';return}S={price:2999,target:15,log:[],clients:[]}}
save();render()});
document.addEventListener('change',function(e){var c=e.target.dataset&&e.target.dataset.c;if(!c)return;var x=S.clients.filter(function(k){return k.id===e.target.dataset.id})[0];if(!x)return;
x[c]=c==='care'?e.target.checked:(c==='price'||c==='paid')?(+e.target.value||0):e.target.value;if(c==='stage')plan(x,todayISO());save();render()});
document.addEventListener('input',function(e){if(e.target.id==='cq'){cq=e.target.value;var l=document.getElementById('cllist');if(l)l.innerHTML=clientList()}});
mig();render();connect();initNative();
