name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - .github/workflows/android.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Copy web app
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Add notification permissions
        run: |
          f=android/app/src/main/AndroidManifest.xml
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$p" "$f" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" "$f"
          done
          grep -n "uses-permission" "$f"

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk agency-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: agency-tracker-apk
          path: agency-tracker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Agency Tracker build ${{ github.run_number }}
          body: Install agency-tracker.apk on your Android phone.
          files: agency-tracker.apk
